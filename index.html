<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Publikációs adatbázisok</title>
<link rel="canonical" href="besenyojanos/">
<style>
:root{--bg:#fbfaf8;--fg:#1a1a1a;--muted:#6b6560;--line:#e0dbd4;--accent:#7a2e2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:16px/1.6 Georgia,"Times New Roman",serif;
 display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
main{max-width:520px}
h1{font-size:23px;margin:0 0 6px;border-bottom:2px solid var(--fg);padding-bottom:14px}
p{color:var(--muted);font-size:14px;margin:14px 0 22px}
ul{list-style:none;margin:0;padding:0}
li{border-bottom:1px solid var(--line);padding:14px 0}
a{color:var(--accent);font-size:17px;font-weight:700;text-decoration:none}
a:hover{text-decoration:underline}
.s{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:3px;
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
</head>
<body>
<main>
  <h1>Publikációs adatbázisok</h1>
  <p>Az alábbi jegyzékek MTMT alapján készültek.</p>
  <ul>
    <li>
      <a href="besenyojanos/">Besenyő János publikációi</a>
      <span class="s">Tudományos közlemények jegyzéke</span>
    </li>
  </ul>
</main>
</body>
</html>
